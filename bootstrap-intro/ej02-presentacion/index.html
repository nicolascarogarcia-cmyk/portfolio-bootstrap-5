<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <!-- PASO 1: Contenedor de la tarjeta -->
  <div class="card shadow" style="width: 22rem;">
    <!-- PASO 2: Imagen superior opcional o Avatar -->
    <img src="https://via.placeholder.com/350x200" class="card-img-top" alt="Foto de perfil">
    
    <!-- PASO 3: Cuerpo de la tarjeta -->
    <div class="card-body text-center">
      <h5 class="card-title fw-bold">Desarrollador Web</h5>
      <p class="card-text text-muted">Estudiante de 2.º DAW apasionado por el desarrollo web y la tecnología.</p>
      
      <!-- PASO 4: Botones de contacto / redes -->
      <a href="#" class="btn btn-primary w-100 mb-2">Contacto</a>
      <a href="#" class="btn btn-outline-secondary w-100">Perfil GitHub</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
