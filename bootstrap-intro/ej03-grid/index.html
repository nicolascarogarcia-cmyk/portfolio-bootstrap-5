<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Grid Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-4">
    <h2 class="mb-4">Prácticas de Grid System</h2>

    <!-- PASO 1: 3 Columnas de igual ancho -->
    <h4 class="h6 text-secondary">1. Columnas automáticas (3 iguales)</h4>
    <div class="row text-center mb-4">
      <div class="col bg-primary text-white p-3 border">Columna 1</div>
      <div class="col bg-secondary text-white p-3 border">Columna 2</div>
      <div class="col bg-success text-white p-3 border">Columna 3</div>
    </div>

    <!-- PASO 2: Rejilla Responsive (1 col en móvil, 2 en tablet, 4 en PC) -->
    <h4 class="h6 text-secondary">2. Columnas Responsive (col-12 col-md-6 col-lg-3)</h4>
    <div class="row text-center mb-4">
      <div class="col-12 col-md-6 col-lg-3 bg-warning p-3 border">Bloque A</div>
      <div class="col-12 col-md-6 col-lg-3 bg-info p-3 border">Bloque B</div>
      <div class="col-12 col-md-6 col-lg-3 bg-danger text-white p-3 border">Bloque C</div>
      <div class="col-12 col-md-6 col-lg-3 bg-dark text-white p-3 border">Bloque D</div>
    </div>

    <!-- PASO 3: Columnas con ancho asimétrico (8 / 4) -->
    <h4 class="h6 text-secondary">3. Contenido principal y Sidebar (8 / 4)</h4>
    <div class="row text-center">
      <div class="col-md-8 bg-light p-3 border">Área Principal (8)</div>
      <div class="col-md-4 bg-secondary text-white p-3 border">Barra Lateral (4)</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
